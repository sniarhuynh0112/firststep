<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mèo hay Chó?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff4f7;
      --dot: #ffd9e4;
      --card: #ffffff;
      --ink: #5b3a4a;
      --ink-soft: #9a7486;
      --pink: #ff8fb1;
      --pink-deep: #f0628f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Baloo 2", system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px);
      background-size: 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      overflow-x: hidden;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border: 4px solid var(--ink);
      border-radius: 36px;
      box-shadow: 0 10px 0 var(--ink);
      padding: 44px 28px 52px;
      text-align: center;
    }

    .badge {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      background: var(--pink);
      color: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 2px 18px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      margin-bottom: 4px;
    }

    .back {
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 0 14px;
      height: 36px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .back:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
    .back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .back[hidden] { display: inline-block; visibility: hidden; }

    .paws {
      font-size: 1.05rem;
      letter-spacing: 2px;
      color: var(--ink-soft);
      font-weight: 700;
    }
    .paws .on { filter: none; }
    .paws .off { filter: grayscale(1); opacity: 0.3; }

    .step { animation: pop 0.4s cubic-bezier(.2,1.5,.4,1); }
    @keyframes pop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 800;
      line-height: 1.2;
      margin: 6px 0 4px;
    }

    .sub {
      color: var(--ink-soft);
      margin: 0 0 24px;
      font-size: 1.05rem;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .choices.n3 { grid-template-columns: repeat(3, 1fr); }

    .choice {
      font: inherit;
      color: var(--ink);
      cursor: pointer;
      border: 4px solid var(--ink);
      border-radius: 26px;
      padding: 14px 8px 10px;
      box-shadow: 0 6px 0 var(--ink);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .choice:nth-child(odd):hover { transform: translateY(-4px) rotate(-2deg); box-shadow: 0 10px 0 var(--ink); }
    .choice:nth-child(even):hover { transform: translateY(-4px) rotate(2deg); box-shadow: 0 10px 0 var(--ink); }
    .choice:active { transform: translateY(5px) !important; box-shadow: 0 1px 0 var(--ink) !important; }
    .choice:focus-visible { outline: 4px dashed var(--pink-deep); outline-offset: 4px; }

    .choice svg { width: 100%; max-width: 92px; height: auto; }
    .big .choice svg { max-width: 130px; }
    .choice:hover svg, .choice:hover .emoji { animation: wiggle 0.5s ease-in-out infinite; }

    .emoji { font-size: 3rem; line-height: 1.1; display: inline-block; }

    .label {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .big .label { font-size: clamp(1.4rem, 5vw, 1.8rem); }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Result */
    .result-pet {
      width: 170px;
      height: auto;
      animation: float 2s ease-in-out infinite;
    }
    .result h2 {
      font-size: clamp(1.5rem, 5.5vw, 2rem);
      margin: 6px 0 10px;
      font-weight: 800;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chip {
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 0 12px;
      font-weight: 700;
      background: #fff;
    }
    .result p { color: var(--ink-soft); margin: 0 0 24px; font-size: 1.15rem; }

    .again {
      font: inherit;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      background: var(--pink);
      border: 4px solid var(--ink);
      border-radius: 999px;
      padding: 8px 28px;
      box-shadow: 0 6px 0 var(--ink);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .again:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--ink); }
    .again:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }

    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.6rem;
      animation: rise 1.6s ease-out forwards;
      z-index: 10;
    }
    @keyframes rise {
      from { transform: translateY(0) scale(0.6); opacity: 1; }
      to { transform: translateY(-220px) scale(1.2); opacity: 0; }
    }

    .paw {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.5;
    }
    .paw.p1 { bottom: 12px; left: 18px; transform: rotate(-20deg); }
    .paw.p2 { bottom: 12px; right: 18px; transform: rotate(20deg); }

    @media (max-width: 480px) {
      .card { padding: 40px 14px 48px; }
      .choices { gap: 12px; }
      .choices.n3 { grid-template-columns: 1fr; }
      .choices.n3 .choice { flex-direction: row; gap: 12px; justify-content: flex-start; padding: 10px 16px; }
      .label { font-size: 1.05rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      <span class="paws" id="paws" aria-hidden="true"></span>

    <div id="stage" aria-live="polite"></div>
    <span class="paw p1" aria-hidden="true">🐾</span>
    <span class="paw p2" aria-hidden="true">🐾</span>

  <script>
    /* =========================================================

       Mỗi câu hỏi: q (câu hỏi), sub (dòng phụ), options (lựa chọn).
       Mỗi lựa chọn:
         label  – chữ trên nút
         pet    – "cat" / "dog" để vẽ hình chibi, hoặc emoji – biểu tượng
         look   – màu lông cho hình chibi (biến CSS)
         bg     – màu nền nút
         next   – id câu hỏi tiếp theo; bỏ trống = kết thúc

         noun / desc – ghép thành câu kết quả
       ========================================================= */

      dogDefault: {},

      dogShiba:   { "--fur": "#d9783a", "--point": "1", "--flop": "0", "--spot": "transparent", "--cheek": "#fffaf2", "--brow": "#fffaf2" },
      dogPoodle:  { "--fur": "#f3cfb3", "--ear": "#e9b896", "--spot": "transparent" },
      dogYellow:  { "--fur": "#f5d08a", "--spot": "transparent", "--point": "1", "--flop": "0", "--inner-d": "#e9b05c" },
      dogBrindle: { "--fur": "#b08a5c", "--ear": "#6e5236", "--spot": "transparent", "--dstripe": "#5e4630" },

    const TREE = {

        ]
      },
      dogSize: {
        q: "Bạn thích bé cỡ nào?",
        sub: "Câu cuối rồi nè ~",
        options: [
          { label: "Nhỏ xíu bỏ túi", emoji: "🤏", bg: "#fde2ec", tag: "Nhỏ xíu", desc: "nhỏ xíu bỏ túi được" },
          { label: "Vừa vừa ôm được", emoji: "🤗", bg: "#ffe9b8", tag: "Vừa ôm", desc: "vừa vặn để ôm mỗi ngày" },
          { label: "To bự như gấu", emoji: "🐻", bg: "#e6f4ff", tag: "To bự", desc: "to bự như gấu bông" }
        ]
      }
    };

    const HEARTS = { cat: ["💛", "🧡", "🐟", "✨"], dog: ["💙", "🦴", "💖", "✨"] };
    const MAX_STEPS = 4;

    const stage = document.getElementById("stage");
    const backBtn = document.getElementById("back");
    const pawsEl = document.getElementById("paws");

    let history = [];   // [{ node, option }]
    let current = "start";

    function styleFrom(lookId) {
      const look = LOOKS[lookId] || {};
      return Object.entries(look).map(([k, v]) => `${k}:${v}`).join(";");
    }

    function petSvg(pet, lookId, cls = "") {
      return `<svg class="${cls}" viewBox="0 0 140 130" style="${styleFrom(lookId)}" aria-hidden="true"><use href="#${pet}"/></svg>`;
    }

    function escape(s) {
      return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function renderPaws(step) {
      let html = "";
      for (let i = 1; i <= MAX_STEPS; i++) html += `<span class="${i <= step ? "on" : "off"}">🐾</span>`;
      pawsEl.innerHTML = html;
    }

    function renderQuestion() {
      const node = TREE[current];
      const n = node.options.length;
      backBtn.hidden = history.length === 0;
      renderPaws(history.length + 1);

      stage.innerHTML = `
        <section class="step ${node.big ? "big" : ""}">
          <h1>${escape(node.q)}</h1>
          <p class="sub">${escape(node.sub || "")}</p>
          <div class="choices n${n}">
            ${node.options.map((o, i) => `
              <button class="choice" type="button" data-i="${i}" style="background:${o.bg}">
                ${o.pet ? petSvg(o.pet, o.look) : `<span class="emoji" aria-hidden="true">${o.emoji}</span>`}
                <span class="label">${escape(o.label)}</span>
              </button>`).join("")}
          </div>
        </section>`;

      stage.querySelectorAll(".choice").forEach(btn => {
        btn.addEventListener("click", () => choose(node.options[+btn.dataset.i], btn));
      });
    }

    function renderResult() {
      const picks = history.map(h => h.option);
      const team = picks[0];
      const pet = team.pet;
      const lookId = [...picks].reverse().find(p => p.look)?.look;
      const noun = [...picks].reverse().find(p => p.noun)?.noun || "một bé cưng";
      const desc = [...picks].reverse().find(p => p.desc)?.desc || "";

      backBtn.hidden = false;
      renderPaws(MAX_STEPS);

      stage.innerHTML = `
        <section class="step result">
          ${petSvg(pet, lookId, "result-pet")}
          <h2>${escape(team.tag)}</h2>
          <div class="chips">${picks.slice(1).map(p => `<span class="chip">${escape(p.tag)}</span>`).join("")}</div>
          <p>Bạn hợp với ${escape(noun)} ${escape(desc)} đó! ♡</p>
          <button class="again" id="again" type="button">Làm lại từ đầu ↺</button>
        </section>`;

      document.getElementById("again").addEventListener("click", () => {
        history = [];
        current = "start";
        renderQuestion();
      });
    }

    function burst(x, y, icons) {
      for (let i = 0; i < 10; i++) {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = icons[i % icons.length];
        h.style.left = (x + (Math.random() - 0.5) * 140) + "px";
        h.style.top = (y + (Math.random() - 0.5) * 40) + "px";
        h.style.animationDelay = (Math.random() * 0.3) + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2000);
      }
    }

    function choose(option, btn) {
      history.push({ node: current, option });
      const team = history[0].option.pet;
      const r = btn.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, HEARTS[team]);

      setTimeout(() => {
        if (option.next) {
          current = option.next;
          renderQuestion();
        } else {
          current = null;
          renderResult();
        }
      }, 220);
    }

    backBtn.addEventListener("click", () => {
      const last = history.pop();
      if (!last) return;
      current = last.node;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
